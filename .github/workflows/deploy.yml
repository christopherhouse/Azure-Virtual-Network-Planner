name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: 'Deploy infrastructure (ACR, CAE, KV, UAMI)'
        required: false
        default: false
        type: boolean
      deploy_dev:
        description: 'Deploy to Dev environment'
        required: false
        default: true
        type: boolean
      deploy_prod:
        description: 'Deploy to Prod environment'
        required: false
        default: false
        type: boolean
      deploy_frontdoor:
        description: 'Deploy Front Door with Private Link (requires container apps to exist)'
        required: false
        default: true
        type: boolean
      create_release:
        description: 'Create GitHub release for current version'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  id-token: write
  contents: write  # Needed for creating releases
  packages: write

jobs:
  # ===========================================================================
  # Job 1a: Build Web and Push to GHCR
  # ===========================================================================
  build-web:
    name: 1a. Build Web & Push to GHCR
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      short-sha: ${{ steps.version.outputs.short_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read VERSION and determine tags
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          
          echo "📦 Version: ${VERSION}"
          echo "🔖 SHA: ${SHORT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ===========================================================================
  # Job 1b: Build API and Push to GHCR
  # ===========================================================================
  build-api:
    name: 1b. Build API & Push to GHCR
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      short-sha: ${{ steps.version.outputs.short_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read VERSION and determine tags
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          
          echo "📦 Version: ${VERSION}"
          echo "🔖 SHA: ${SHORT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=sha,prefix=
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # ===========================================================================
  # Job 2: Deploy Core Infrastructure (optional)
  # ===========================================================================
  deploy-infra-dev:
    name: 2a. Deploy Infra (Dev)
    needs: [build-web, build-api]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_dev == 'true')
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Core Infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: ./infra/main.dev.bicepparam
          deploymentName: infra-dev-${{ github.run_id }}
          failOnStdErr: false

  deploy-infra-prod:
    name: 2b. Deploy Infra (Prod)
    needs: [build-web, build-api, deploy-web-dev, deploy-api-dev]
    runs-on: ubuntu-latest
    if: |
      always() && !cancelled() && 
      needs.deploy-web-dev.result == 'success' && 
      needs.deploy-api-dev.result == 'success' &&
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_prod == 'true'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Core Infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: ./infra/main.prod.bicepparam
          deploymentName: infra-prod-${{ github.run_id }}
          failOnStdErr: false

  # ===========================================================================
  # Job 3a: Import Web to ACR (Dev)
  # ===========================================================================
  import-acr-web-dev:
    name: 3a. Import Web to ACR (Dev)
    needs: [build-web, deploy-infra-dev]
    runs-on: ubuntu-latest
    if: |
      always() && !cancelled() && 
      needs.build-web.result == 'success' && 
      needs.deploy-infra-dev.result == 'success'
    environment: development

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Import image to ACR
        run: |
          echo "🔄 Importing Web image from GHCR to ACR (Dev)..."
          echo "🏷️  Version: v${{ needs.build-web.outputs.version }}"
          echo "🔖 SHA: ${{ needs.build-web.outputs.short-sha }}"
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          az acr import \
            --name ${{ vars.ACR_NAME }} \
            --source ${{ env.REGISTRY }}/${IMAGE_NAME_LOWER}:${{ needs.build-web.outputs.short-sha }} \
            --image vnetplanner:${{ needs.build-web.outputs.short-sha }} \
            --image vnetplanner:v${{ needs.build-web.outputs.version }} \
            --image vnetplanner:dev \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --force
          echo "✅ Web image imported to Dev ACR"

  # ===========================================================================
  # Job 3b: Import API to ACR (Dev)
  # ===========================================================================
  import-acr-api-dev:
    name: 3b. Import API to ACR (Dev)
    needs: [build-api, deploy-infra-dev]
    runs-on: ubuntu-latest
    if: |
      always() && !cancelled() && 
      needs.build-api.result == 'success' && 
      needs.deploy-infra-dev.result == 'success'
    environment: development

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Import image to ACR
        run: |
          echo "🔄 Importing API image from GHCR to ACR (Dev)..."
          echo "🏷️  Version: v${{ needs.build-api.outputs.version }}"
          echo "🔖 SHA: ${{ needs.build-api.outputs.short-sha }}"
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}-api" | tr '[:upper:]' '[:lower:]')
          az acr import \
            --name ${{ vars.ACR_NAME }} \
            --source ${{ env.REGISTRY }}/${IMAGE_NAME_LOWER}:${{ needs.build-api.outputs.short-sha }} \
            --image vnetplanner-api:${{ needs.build-api.outputs.short-sha }} \
            --image vnetplanner-api:v${{ needs.build-api.outputs.version }} \
            --image vnetplanner-api:dev \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --force
          echo "✅ API image imported to Dev ACR"

  # ===========================================================================
  # Job 3c: Import Web to ACR (Prod)
  # ===========================================================================
  import-acr-web-prod:
    name: 3c. Import Web to ACR (Prod)
    needs: [build-web, deploy-infra-prod]
    runs-on: ubuntu-latest
    if: |
      always() && !cancelled() && 
      needs.build-web.result == 'success' && 
      needs.deploy-infra-prod.result == 'success'
    environment: production

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Import image to ACR
        run: |
          echo "🔄 Importing Web image from GHCR to ACR (Prod)..."
          echo "🏷️  Version: v${{ needs.build-web.outputs.version }}"
          echo "🔖 SHA: ${{ needs.build-web.outputs.short-sha }}"
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          az acr import \
            --name ${{ vars.ACR_NAME }} \
            --source ${{ env.REGISTRY }}/${IMAGE_NAME_LOWER}:${{ needs.build-web.outputs.short-sha }} \
            --image vnetplanner:${{ needs.build-web.outputs.short-sha }} \
            --image vnetplanner:v${{ needs.build-web.outputs.version }} \
            --image vnetplanner:latest \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --force
          echo "✅ Web image imported to Prod ACR"

  # ===========================================================================
  # Job 3d: Import API to ACR (Prod)
  # ===========================================================================
  import-acr-api-prod:
    name: 3d. Import API to ACR (Prod)
    needs: [build-api, deploy-infra-prod]
    runs-on: ubuntu-latest
    if: |
      always() && !cancelled() && 
      needs.build-api.result == 'success' && 
      needs.deploy-infra-prod.result == 'success'
    environment: production

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Import image to ACR
        run: |
          echo "🔄 Importing API image from GHCR to ACR (Prod)..."
          echo "🏷️  Version: v${{ needs.build-api.outputs.version }}"
          echo "🔖 SHA: ${{ needs.build-api.outputs.short-sha }}"
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}-api" | tr '[:upper:]' '[:lower:]')
          az acr import \
            --name ${{ vars.ACR_NAME }} \
            --source ${{ env.REGISTRY }}/${IMAGE_NAME_LOWER}:${{ needs.build-api.outputs.short-sha }} \
            --image vnetplanner-api:${{ needs.build-api.outputs.short-sha }} \
            --image vnetplanner-api:v${{ needs.build-api.outputs.version }} \
            --image vnetplanner-api:latest \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --force
          echo "✅ API image imported to Prod ACR"

  # ===========================================================================
  # Job 4a: Deploy Web to Dev
  # ===========================================================================
  deploy-web-dev:
    name: 4a. Deploy Web (Dev)
    needs: [build-web, import-acr-web-dev]
    runs-on: ubuntu-latest
    if: |
      always() && !cancelled() && needs.import-acr-web-dev.result == 'success'
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Container App
        run: |
          chmod +x ./infra/scripts/deploy-web.sh
          ./infra/scripts/deploy-web.sh
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          ENVIRONMENT: dev
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_TAG: ${{ needs.build-web.outputs.short-sha }}
          IMAGE_VERSION: ${{ needs.build-web.outputs.version }}
          BASE_NAME: vnetplanner
          LOCATION: eastus2

  # ===========================================================================
  # Job 4b: Deploy API to Dev
  # ===========================================================================
  deploy-api-dev:
    name: 4b. Deploy API (Dev)
    needs: [build-api, import-acr-api-dev]
    runs-on: ubuntu-latest
    if: |
      always() && !cancelled() && needs.import-acr-api-dev.result == 'success'
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API Container App
        run: |
          chmod +x ./infra/scripts/deploy-api.sh
          ./infra/scripts/deploy-api.sh
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          ENVIRONMENT: dev
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_TAG: ${{ needs.build-api.outputs.short-sha }}
          IMAGE_VERSION: ${{ needs.build-api.outputs.version }}
          BASE_NAME: vnetplanner
          LOCATION: eastus2

  # ===========================================================================
  # Job 5a: Deploy Web to Prod
  # ===========================================================================
  deploy-web-prod:
    name: 5a. Deploy Web (Prod)
    needs: [build-web, import-acr-web-prod, deploy-web-dev]
    runs-on: ubuntu-latest
    if: |
      always() && !cancelled() && 
      needs.import-acr-web-prod.result == 'success' && 
      needs.deploy-web-dev.result == 'success'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Container App
        run: |
          chmod +x ./infra/scripts/deploy-web.sh
          ./infra/scripts/deploy-web.sh
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          ENVIRONMENT: prod
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_TAG: ${{ needs.build-web.outputs.short-sha }}
          IMAGE_VERSION: ${{ needs.build-web.outputs.version }}
          BASE_NAME: vnetplanner
          LOCATION: eastus

  # ===========================================================================
  # Job 5b: Deploy API to Prod
  # ===========================================================================
  deploy-api-prod:
    name: 5b. Deploy API (Prod)
    needs: [build-api, import-acr-api-prod, deploy-api-dev]
    runs-on: ubuntu-latest
    if: |
      always() && !cancelled() && 
      needs.import-acr-api-prod.result == 'success' && 
      needs.deploy-api-dev.result == 'success'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API Container App
        run: |
          chmod +x ./infra/scripts/deploy-api.sh
          ./infra/scripts/deploy-api.sh
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          ENVIRONMENT: prod
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_TAG: ${{ needs.build-api.outputs.short-sha }}
          IMAGE_VERSION: ${{ needs.build-api.outputs.version }}
          BASE_NAME: vnetplanner
          LOCATION: eastus

  # ===========================================================================
  # Job 6a: Deploy Front Door (Dev)
  # ===========================================================================
  deploy-frontdoor-dev:
    name: 6a. Deploy Front Door (Dev)
    needs: [deploy-web-dev, deploy-api-dev]
    runs-on: ubuntu-latest
    if: |
      always() && !cancelled() && 
      needs.deploy-web-dev.result == 'success' && 
      needs.deploy-api-dev.result == 'success' &&
      (github.event_name == 'push' || github.event.inputs.deploy_frontdoor == 'true')
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Container App FQDNs and Environment Details
        id: get-endpoints
        run: |
          set -e  # Exit on any error
          echo "🔍 Getting Container Apps Environment details..."
          CAE_NAME="cae-vnetplanner-dev"
          WEB_APP_NAME="ca-vnetplanner-web-dev"
          API_APP_NAME="ca-vnetplanner-api-dev"
          WAF_POLICY_NAME="wafpolvnetplannerdev"
          
          # Get Container Apps Environment ID
          echo "Getting CAE ID..."
          CAE_ID=$(az containerapp env show \
            --name "$CAE_NAME" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "id" -o tsv)
          if [ -z "$CAE_ID" ]; then
            echo "❌ Failed to get Container Apps Environment ID"
            exit 1
          fi
          echo "cae_id=$CAE_ID" >> $GITHUB_OUTPUT
          
          # Get Container Apps Environment location (normalize to API format)
          echo "Getting CAE location..."
          CAE_LOCATION_RAW=$(az containerapp env show \
            --name "$CAE_NAME" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "location" -o tsv)
          CAE_LOCATION=$(echo "$CAE_LOCATION_RAW" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
          echo "cae_location=$CAE_LOCATION" >> $GITHUB_OUTPUT
          
          # Get Web App FQDN
          echo "Getting Web App FQDN..."
          WEB_FQDN=$(az containerapp show \
            --name "$WEB_APP_NAME" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          if [ -z "$WEB_FQDN" ]; then
            echo "❌ Failed to get Web App FQDN"
            exit 1
          fi
          echo "web_fqdn=$WEB_FQDN" >> $GITHUB_OUTPUT
          
          # Get API App FQDN
          echo "Getting API App FQDN..."
          API_FQDN=$(az containerapp show \
            --name "$API_APP_NAME" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          if [ -z "$API_FQDN" ]; then
            echo "❌ Failed to get API App FQDN"
            exit 1
          fi
          echo "api_fqdn=$API_FQDN" >> $GITHUB_OUTPUT
          
          # Get WAF Policy ID
          echo "Getting WAF Policy ID..."
          WAF_POLICY_ID=$(az network front-door waf-policy show \
            --name "$WAF_POLICY_NAME" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "id" -o tsv)
          if [ -z "$WAF_POLICY_ID" ]; then
            echo "❌ Failed to get WAF Policy ID (looking for: $WAF_POLICY_NAME)"
            exit 1
          fi
          echo "waf_policy_id=$WAF_POLICY_ID" >> $GITHUB_OUTPUT
          
          # Get Log Analytics Workspace ID
          echo "Getting Log Analytics Workspace ID..."
          LOG_ANALYTICS_NAME="log-vnetplanner-dev"
          LOG_ANALYTICS_ID=$(az monitor log-analytics workspace show \
            --workspace-name "$LOG_ANALYTICS_NAME" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "id" -o tsv)
          if [ -z "$LOG_ANALYTICS_ID" ]; then
            echo "⚠️ Warning: Failed to get Log Analytics Workspace ID (diagnostics will be skipped)"
            LOG_ANALYTICS_ID=""
          fi
          echo "log_analytics_id=$LOG_ANALYTICS_ID" >> $GITHUB_OUTPUT
          
          echo "✅ Container Apps Environment ID: $CAE_ID"
          echo "✅ CAE Location: $CAE_LOCATION"
          echo "✅ Web FQDN: $WEB_FQDN"
          echo "✅ API FQDN: $API_FQDN"
          echo "✅ WAF Policy ID: $WAF_POLICY_ID"
          echo "✅ Log Analytics Workspace ID: $LOG_ANALYTICS_ID"

      - name: Generate Front Door Parameters File
        run: |
          cat > frontdoor-params-dev.json << EOF
          {
            "\$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            "contentVersion": "1.0.0.0",
            "parameters": {
              "environment": { "value": "dev" },
              "location": { "value": "${{ steps.get-endpoints.outputs.cae_location }}" },
              "webAppHostname": { "value": "${{ steps.get-endpoints.outputs.web_fqdn }}" },
              "apiAppHostname": { "value": "${{ steps.get-endpoints.outputs.api_fqdn }}" },
              "containerAppsEnvironmentId": { "value": "${{ steps.get-endpoints.outputs.cae_id }}" },
              "wafPolicyId": { "value": "${{ steps.get-endpoints.outputs.waf_policy_id }}" },
              "logAnalyticsWorkspaceId": { "value": "${{ steps.get-endpoints.outputs.log_analytics_id }}" }
            }
          }
          EOF
          echo "📋 Generated parameters file:"
          cat frontdoor-params-dev.json

      - name: Deploy Front Door
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.RESOURCE_GROUP }}
          template: ./infra/front-door-deployment.bicep
          parameters: frontdoor-params-dev.json
          deploymentName: frontdoor-dev-${{ github.run_id }}
          failOnStdErr: false

      - name: Approve Private Link Connections
        run: |
          echo "🔗 Approving Private Link connections..."
          CAE_NAME="cae-vnetplanner-dev"
          
          # Wait for private endpoints to be created
          sleep 30
          
          # Get and approve all pending private endpoint connections
          PENDING_CONNECTIONS=$(az containerapp env show \
            --name "$CAE_NAME" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "properties.privateEndpointConnections[?properties.privateLinkServiceConnectionState.status=='Pending'].name" -o tsv)
          
          for CONN_NAME in $PENDING_CONNECTIONS; do
            echo "✅ Approving connection: $CONN_NAME"
            az containerapp env update \
              --name "$CAE_NAME" \
              --resource-group "${{ vars.RESOURCE_GROUP }}" \
              --private-endpoint-connection-name "$CONN_NAME" \
              --private-endpoint-connection-approval-status "Approved" \
              --output none
          done
          
          echo "✅ All Private Link connections approved!"

  # ===========================================================================
  # Job 6b: Deploy Front Door (Prod)
  # ===========================================================================
  deploy-frontdoor-prod:
    name: 6b. Deploy Front Door (Prod)
    needs: [deploy-web-prod, deploy-api-prod, deploy-frontdoor-dev]
    runs-on: ubuntu-latest
    if: |
      always() && !cancelled() && 
      needs.deploy-web-prod.result == 'success' && 
      needs.deploy-api-prod.result == 'success' &&
      (needs.deploy-frontdoor-dev.result == 'success' || needs.deploy-frontdoor-dev.result == 'skipped') &&
      (github.event_name == 'push' || github.event.inputs.deploy_frontdoor == 'true')
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Container App FQDNs and Environment Details
        id: get-endpoints
        run: |
          set -e  # Exit on any error
          echo "🔍 Getting Container Apps Environment details..."
          CAE_NAME="cae-vnetplanner-prod"
          WEB_APP_NAME="ca-vnetplanner-web-prod"
          API_APP_NAME="ca-vnetplanner-api-prod"
          WAF_POLICY_NAME="wafpolvnetplannerprod"
          
          # Get Container Apps Environment ID
          echo "Getting CAE ID..."
          CAE_ID=$(az containerapp env show \
            --name "$CAE_NAME" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "id" -o tsv)
          if [ -z "$CAE_ID" ]; then
            echo "❌ Failed to get Container Apps Environment ID"
            exit 1
          fi
          echo "cae_id=$CAE_ID" >> $GITHUB_OUTPUT
          
          # Get Container Apps Environment location (normalize to API format)
          echo "Getting CAE location..."
          CAE_LOCATION_RAW=$(az containerapp env show \
            --name "$CAE_NAME" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "location" -o tsv)
          CAE_LOCATION=$(echo "$CAE_LOCATION_RAW" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
          echo "cae_location=$CAE_LOCATION" >> $GITHUB_OUTPUT
          
          # Get Web App FQDN
          echo "Getting Web App FQDN..."
          WEB_FQDN=$(az containerapp show \
            --name "$WEB_APP_NAME" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          if [ -z "$WEB_FQDN" ]; then
            echo "❌ Failed to get Web App FQDN"
            exit 1
          fi
          echo "web_fqdn=$WEB_FQDN" >> $GITHUB_OUTPUT
          
          # Get API App FQDN
          echo "Getting API App FQDN..."
          API_FQDN=$(az containerapp show \
            --name "$API_APP_NAME" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          if [ -z "$API_FQDN" ]; then
            echo "❌ Failed to get API App FQDN"
            exit 1
          fi
          echo "api_fqdn=$API_FQDN" >> $GITHUB_OUTPUT
          
          # Get WAF Policy ID
          echo "Getting WAF Policy ID..."
          WAF_POLICY_ID=$(az network front-door waf-policy show \
            --name "$WAF_POLICY_NAME" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "id" -o tsv)
          if [ -z "$WAF_POLICY_ID" ]; then
            echo "❌ Failed to get WAF Policy ID (looking for: $WAF_POLICY_NAME)"
            exit 1
          fi
          echo "waf_policy_id=$WAF_POLICY_ID" >> $GITHUB_OUTPUT
          
          # Get Log Analytics Workspace ID
          echo "Getting Log Analytics Workspace ID..."
          LOG_ANALYTICS_NAME="log-vnetplanner-prod"
          LOG_ANALYTICS_ID=$(az monitor log-analytics workspace show \
            --workspace-name "$LOG_ANALYTICS_NAME" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "id" -o tsv)
          if [ -z "$LOG_ANALYTICS_ID" ]; then
            echo "⚠️ Warning: Failed to get Log Analytics Workspace ID (diagnostics will be skipped)"
            LOG_ANALYTICS_ID=""
          fi
          echo "log_analytics_id=$LOG_ANALYTICS_ID" >> $GITHUB_OUTPUT
          
          echo "✅ Container Apps Environment ID: $CAE_ID"
          echo "✅ CAE Location: $CAE_LOCATION"
          echo "✅ Web FQDN: $WEB_FQDN"
          echo "✅ API FQDN: $API_FQDN"
          echo "✅ WAF Policy ID: $WAF_POLICY_ID"
          echo "✅ Log Analytics Workspace ID: $LOG_ANALYTICS_ID"

      - name: Generate Front Door Parameters File
        run: |
          cat > frontdoor-params-prod.json << EOF
          {
            "\$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            "contentVersion": "1.0.0.0",
            "parameters": {
              "environment": { "value": "prod" },
              "location": { "value": "${{ steps.get-endpoints.outputs.cae_location }}" },
              "webAppHostname": { "value": "${{ steps.get-endpoints.outputs.web_fqdn }}" },
              "apiAppHostname": { "value": "${{ steps.get-endpoints.outputs.api_fqdn }}" },
              "containerAppsEnvironmentId": { "value": "${{ steps.get-endpoints.outputs.cae_id }}" },
              "wafPolicyId": { "value": "${{ steps.get-endpoints.outputs.waf_policy_id }}" },
              "logAnalyticsWorkspaceId": { "value": "${{ steps.get-endpoints.outputs.log_analytics_id }}" }
            }
          }
          EOF
          echo "📋 Generated parameters file:"
          cat frontdoor-params-prod.json

      - name: Deploy Front Door
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.RESOURCE_GROUP }}
          template: ./infra/front-door-deployment.bicep
          parameters: frontdoor-params-prod.json
          deploymentName: frontdoor-prod-${{ github.run_id }}
          failOnStdErr: false

      - name: Approve Private Link Connections
        run: |
          echo "🔗 Approving Private Link connections..."
          CAE_NAME="cae-vnetplanner-prod"
          
          # Wait for private endpoints to be created
          sleep 30
          
          # Get and approve all pending private endpoint connections
          PENDING_CONNECTIONS=$(az containerapp env show \
            --name "$CAE_NAME" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "properties.privateEndpointConnections[?properties.privateLinkServiceConnectionState.status=='Pending'].name" -o tsv)
          
          for CONN_NAME in $PENDING_CONNECTIONS; do
            echo "✅ Approving connection: $CONN_NAME"
            az containerapp env update \
              --name "$CAE_NAME" \
              --resource-group "${{ vars.RESOURCE_GROUP }}" \
              --private-endpoint-connection-name "$CONN_NAME" \
              --private-endpoint-connection-approval-status "Approved" \
              --output none
          done
          
          echo "✅ All Private Link connections approved!"

  # ===========================================================================
  # Job 7: Create GitHub Release
  # ===========================================================================
  create-release:
    name: 7. Create Release
    needs: [build-web, build-api, deploy-web-prod, deploy-api-prod, deploy-frontdoor-prod]
    runs-on: ubuntu-latest
    if: |
      always() && !cancelled() && 
      needs.deploy-web-prod.result == 'success' &&
      needs.deploy-api-prod.result == 'success' &&
      (needs.deploy-frontdoor-prod.result == 'success' || needs.deploy-frontdoor-prod.result == 'skipped') &&
      github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-web.outputs.version }}
          name: Release v${{ needs.build-web.outputs.version }}
          body: |
            ## 🚀 Release v${{ needs.build-web.outputs.version }}
            
            **Commit:** ${{ github.sha }}
            **Build:** ${{ needs.build-web.outputs.short-sha }}
            
            ### Container Images (Web)
            - GHCR: `ghcr.io/${{ github.repository }}:v${{ needs.build-web.outputs.version }}`
            - ACR: `${{ vars.ACR_NAME }}.azurecr.io/vnetplanner:v${{ needs.build-web.outputs.version }}`
            
            ### Container Images (API)
            - GHCR: `ghcr.io/${{ github.repository }}-api:v${{ needs.build-api.outputs.version }}`
            - ACR: `${{ vars.ACR_NAME }}.azurecr.io/vnetplanner-api:v${{ needs.build-api.outputs.version }}`
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
