# Trivy Container Security Scanning
# Scans both API and Web containers for vulnerabilities

name: trivy

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main", "feature/*"]
  schedule:
    - cron: '19 16 * * 5'

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Scan ${{ matrix.container }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - api
          - web
        include:
          - container: api
            dockerfile: Dockerfile.api
          - container: web
            dockerfile: Dockerfile.web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ${{ matrix.container }} image
        run: |
          docker build -f ${{ matrix.dockerfile }} -t vnet-planner-${{ matrix.container }}:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'vnet-planner-${{ matrix.container }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-${{ matrix.container }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.container }}.sarif'
          category: 'trivy-${{ matrix.container }}'
