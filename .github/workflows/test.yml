name: Test and Quality

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'infra/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'infra/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ===========================================================================
  # Web: Lint and Type Check
  # ===========================================================================
  lint-web:
    name: Web - Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Run TypeScript type check
        working-directory: ./apps/web
        run: npm run type-check

      - name: Run ESLint
        working-directory: ./apps/web
        run: npm run lint -- --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
        continue-on-error: true

      - name: Upload ESLint results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: apps/web/eslint-results.sarif
          wait-for-processing: true
        continue-on-error: true

      - name: Check Prettier formatting
        working-directory: ./apps/web
        run: npm run format:check

  # ===========================================================================
  # Web: Unit Tests with Coverage
  # ===========================================================================
  test-web:
    name: Web - Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Run tests with coverage
        working-directory: ./apps/web
        run: npm run test:coverage -- --reporter=verbose --reporter=junit --outputFile=./test-results/junit.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: apps/web/test-results/
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage-report
          path: apps/web/coverage/
          retention-days: 30

      - name: Test Report Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Vitest Tests (Web)
          path: apps/web/test-results/junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Coverage Report
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          working-directory: ./apps/web
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json

  # ===========================================================================
  # Web: Build Verification
  # ===========================================================================
  build-web:
    name: Web - Build Verification
    runs-on: ubuntu-latest
    needs: [lint-web, test-web]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Build Next.js app
        working-directory: ./apps/web
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nextjs-build
          path: apps/web/.next/
          retention-days: 7

  # ===========================================================================
  # API: Lint and Type Check
  # ===========================================================================
  lint-api:
    name: API - Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: ./apps/api
        run: uv sync

      - name: Run Ruff linting
        working-directory: ./apps/api
        run: uv run ruff check src tests --output-format=github

      - name: Run Ruff format check
        working-directory: ./apps/api
        run: uv run ruff format --check src tests

      - name: Run mypy type check
        working-directory: ./apps/api
        run: uv run mypy src

  # ===========================================================================
  # API: Unit Tests with Coverage
  # ===========================================================================
  test-api:
    name: API - Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: ./apps/api
        run: uv sync

      - name: Run tests with coverage
        working-directory: ./apps/api
        run: uv run pytest --cov --cov-report=xml --cov-report=html --junitxml=test-results/junit.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: apps/api/test-results/
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage-report
          path: apps/api/htmlcov/
          retention-days: 30

      - name: Test Report Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Pytest Tests (API)
          path: apps/api/test-results/junit.xml
          reporter: java-junit
          fail-on-error: true

  # ===========================================================================
  # Infrastructure: Bicep Validation
  # ===========================================================================
  validate-infra:
    name: Infra - Bicep Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Azure CLI
        uses: azure/setup-azure-cli@v1

      - name: Install Bicep CLI
        run: az bicep install

      - name: Validate Bicep templates
        working-directory: ./infra
        run: |
          echo "Building main.bicep..."
          az bicep build --file main.bicep
          echo "Building front-door-deployment.bicep..."
          az bicep build --file front-door-deployment.bicep
          echo "✅ All Bicep templates validated successfully"

  # ===========================================================================
  # Quality Gate Summary
  # ===========================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint-web, test-web, build-web, lint-api, test-api, validate-infra]
    if: always()
    
    steps:
      - name: Check Quality Gate
        run: |
          echo "## Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Web (Next.js)" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.lint-web.result }}" == "success" ]; then
            echo "✅ **Lint & Type Check**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Lint & Type Check**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.test-web.result }}" == "success" ]; then
            echo "✅ **Unit Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Unit Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-web.result }}" == "success" ]; then
            echo "✅ **Build**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### API (FastAPI)" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.lint-api.result }}" == "success" ]; then
            echo "✅ **Lint & Type Check**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Lint & Type Check**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.test-api.result }}" == "success" ]; then
            echo "✅ **Unit Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Unit Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Infrastructure (Bicep)" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.validate-infra.result }}" == "success" ]; then
            echo "✅ **Bicep Validation**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Bicep Validation**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Quality Gate Status
        if: |
          needs.lint-web.result != 'success' ||
          needs.test-web.result != 'success' ||
          needs.build-web.result != 'success' ||
          needs.lint-api.result != 'success' ||
          needs.test-api.result != 'success' ||
          needs.validate-infra.result != 'success'
        run: |
          echo "❌ Quality gate failed - one or more checks did not pass"
          exit 1

      - name: Quality Gate Passed
        if: |
          needs.lint-web.result == 'success' &&
          needs.test-web.result == 'success' &&
          needs.build-web.result == 'success' &&
          needs.lint-api.result == 'success' &&
          needs.test-api.result == 'success' &&
          needs.validate-infra.result == 'success'
        run: |
          echo "✅ All quality checks passed!"
